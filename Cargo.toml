[workspace]
resolver = "3"
members = ["crates/aars-core", "crates/aars-sources", "crates/aars-audio", "crates/aars-ptt", "crates/aars-web", "crates/aars"]

[workspace.package]
edition = "2024"
rust-version = "1.93"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
figment = { version = "0.10", features = ["toml", "env", "test"] }
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
croner = "4"
argon2 = "0.6"
rand = "0.9"
axum = "0.8"
askama = "0.16"
rust-embed = "8"
tower = "0.5"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1"
chrono-tz = "0.10"
wiremock = "0.6"
