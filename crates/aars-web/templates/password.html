{% extends "base.html" %}
{% block title %}AARS — zmiana hasła{% endblock %}
{% block content %}
<div class="card">
  <h2>Zmiana hasła</h2>
  {% if must_change %}<p class="error">To konto ma hasło tymczasowe. Ustaw własne hasło, żeby korzystać z panelu.</p>{% endif %}
  {% if let Some(message) = error %}<p class="error">{{ message }}</p>{% endif %}
  <form method="post" action="/account/password">
    <input type="hidden" name="csrf" value="{{ chrome.csrf }}">
    <div class="field">
      <label for="current">Obecne hasło</label>
      <input id="current" name="current" type="password" autocomplete="current-password" required>
    </div>
    <div class="field">
      <label for="new">Nowe hasło (min. 10 znaków)</label>
      <input id="new" name="new" type="password" autocomplete="new-password" minlength="10" required>
    </div>
    <div class="field">
      <label for="confirm">Powtórz nowe hasło</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="10" required>
    </div>
    <button type="submit">Zmień hasło</button>
  </form>
</div>
{% endblock %}
