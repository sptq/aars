{% extends "base.html" %}
{% block title %}AARS — nadaj komunikat{% endblock %}
{% block content %}
<div class="card">
  <h2>Nadaj komunikat</h2>
  <form method="post" action="/compose">
    <input type="hidden" name="csrf" value="{{ chrome.csrf }}">
    <div style="margin-bottom:0.9rem">
      <label for="text">Treść</label>
      <textarea id="text" name="text" required
                placeholder="Uwaga, ostrzeżenie meteorologiczne..."></textarea>
    </div>
    <div class="row">
      <div>
        <label for="priority">Priorytet</label>
        <select id="priority" name="priority">
          <option value="normal" selected>Zwykły</option>
          <option value="low">Niski</option>
          <option value="high">Wysoki</option>
          <option value="emergency">Alarmowy</option>
        </select>
      </div>
      <div>
        <label for="repeat">Powtórzeń</label>
        <input id="repeat" name="repeat" type="number" value="1" min="1" max="20">
      </div>
      <div>
        <label for="every">Odstęp (s)</label>
        <input id="every" name="every" type="number" value="600" min="0">
      </div>
    </div>
    <label style="display:flex;gap:0.5rem;align-items:center;margin-bottom:1rem">
      <input type="checkbox" name="interrupting" value="1" style="width:auto">
      Przerwij trwające nadanie o niższym priorytecie
    </label>
    <div style="margin-bottom:1rem">
      <button type="button" class="ghost" id="preview-btn">Odsłuchaj</button>
      <span id="preview-note" style="color:var(--muted)"></span>
      <audio id="preview-audio" controls style="width:100%;margin-top:0.5rem"></audio>
    </div>
    <button type="submit">Do kolejki</button>
  </form>
</div>

<script>
(function () {
  var btn = document.getElementById('preview-btn');
  if (!btn) return;
  var audio = document.getElementById('preview-audio');
  var note = document.getElementById('preview-note');
  btn.addEventListener('click', function () {
    var form = btn.form;
    var body = new URLSearchParams();
    body.set('text', form.elements['text'].value);
    body.set('csrf', form.elements['csrf'].value);
    note.textContent = 'Synteza…';
    fetch('/preview', { method: 'POST', body: body })
      .then(function (r) {
        if (!r.ok) return r.text().then(function (t) { throw new Error(t); });
        return r.blob();
      })
      .then(function (blob) {
        note.textContent = '';
        if (audio.dataset.url) URL.revokeObjectURL(audio.dataset.url);
        audio.dataset.url = URL.createObjectURL(blob);
        audio.src = audio.dataset.url;
        audio.play();
      })
      .catch(function (e) { note.textContent = e.message; });
  });
})();
</script>
{% endblock %}
