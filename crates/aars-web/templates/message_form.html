{% extends "base.html" %}
{% block title %}AARS — komunikat{% endblock %}
{% block content %}
<div class="card">
  <h2>{% if id.is_some() %}Edycja komunikatu{% else %}Nowy komunikat{% endif %}</h2>
  <form method="post" action="{% if let Some(id) = id %}/messages/{{ id }}{% else %}/messages{% endif %}"
        id="message-form">
    <input type="hidden" name="csrf" value="{{ chrome.csrf }}">
    <div style="margin-bottom:0.9rem">
      <label for="title">Tytuł</label>
      <input id="title" name="title" required value="{{ title }}">
    </div>
    <div style="margin-bottom:0.9rem">
      <label for="text">Treść</label>
      <textarea id="text" name="text" required>{{ text }}</textarea>
    </div>
    <div class="row">
      <div>
        <label for="priority">Priorytet</label>
        <select id="priority" name="priority">
          <option value="normal" {% if priority == "normal" %}selected{% endif %}>Zwykły</option>
          <option value="low" {% if priority == "low" %}selected{% endif %}>Niski</option>
          <option value="high" {% if priority == "high" %}selected{% endif %}>Wysoki</option>
          <option value="emergency" {% if priority == "emergency" %}selected{% endif %}>Alarmowy</option>
        </select>
      </div>
      <div>
        <label for="repeat">Powtórzeń</label>
        <input id="repeat" name="repeat" type="number" value="{{ repeat }}" min="1" max="20">
      </div>
      <div>
        <label for="every">Odstęp (s)</label>
        <input id="every" name="every" type="number" value="{{ every }}" min="0">
      </div>
    </div>
    <label style="display:flex;gap:0.5rem;align-items:center;margin-bottom:1rem">
      <input type="checkbox" name="interrupting" value="1" style="width:auto"
             {% if interrupting %}checked{% endif %}>
      Przerwij trwające nadanie o niższym priorytecie
    </label>
    <div class="row">
      <div>
        <label for="schedule_kind">Harmonogram</label>
        <select id="schedule_kind" name="schedule_kind">
          <option value="immediate" {% if kind == "immediate" %}selected{% endif %}>Na żądanie</option>
          <option value="at" {% if kind == "at" %}selected{% endif %}>Jednorazowo</option>
          <option value="cron" {% if kind == "cron" %}selected{% endif %}>Cyklicznie (cron)</option>
        </select>
      </div>
      <div>
        <label for="at">Jednorazowo — czas lokalny</label>
        <input id="at" name="at" type="datetime-local" value="{{ at }}">
      </div>
      <div>
        <label for="cron">Cron, UTC</label>
        <input id="cron" name="cron" placeholder="0 18 * * *" value="{{ cron }}">
      </div>
    </div>
    <p id="next-hint" style="color:var(--muted)"
       hx-get="/messages/next" hx-include="#message-form"
       hx-trigger="load, input from:#message-form, change from:#message-form"></p>
    <button type="submit">Zapisz</button>
    <a href="/messages">Anuluj</a>
  </form>
</div>
{% endblock %}
