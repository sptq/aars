<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AARS — logowanie</title>
  <script src="/assets/theme.js?v={{ crate::assets::stamp() }}"></script>
  <link rel="stylesheet" href="/assets/app.css?v={{ crate::assets::stamp() }}">
</head>
<body class="auth">
<main class="auth-main">
  <div class="card auth-card">
    <p class="brand">AARS — stacja ostrzegawcza</p>
    <h1>Logowanie</h1>
    {% if let Some(message) = error %}<p class="alert">{{ message }}</p>{% endif %}
    <form method="post" action="/login">
      <div class="field">
        <label for="username">Użytkownik</label>
        <input id="username" name="username" autocomplete="username" autofocus required>
      </div>
      <div class="field">
        <label for="password">Hasło</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required>
      </div>
      <button type="submit">Wejdź</button>
    </form>
  </div>
</main>
<footer class="version">AARS {{ version }}</footer>
</body>
</html>
