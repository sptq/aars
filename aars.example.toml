# Skopiuj do aars.toml i dostosuj. Każde pole można nadpisać zmienną
# środowiskową, np. AARS_STORAGE__DB_PATH=/var/lib/aars/aars.db
#
# Na świeżej instalacji wystarczą ścieżki poniżej. Sprzęt (PTT, audio, głos,
# adres panelu) ustawia administrator w panelu: Ustawienia → Sprzęt.

[storage]
db_path = "var/aars.db"
cache_dir = "var/cache"
cache_max_bytes = 536870912

[tts]
piper_bin = "piper"
# Katalog z głosami: panel pokazuje pliki *.onnx, które mają obok *.onnx.json.
voices_dir = "/var/lib/aars/voices"
# Ustawiane w panelu (Ustawienia → Sprzęt). Wartości tutaj są tylko startowe; panel ma pierwszeństwo.
# model = "/var/lib/aars/voices/pl_PL-darkman-medium.onnx"

[sources]
# Adres API ostrzeżeń meteo IMGW. Włączanie źródła, obszar i interwał ustawia
# się w panelu (/modules); źródło po instalacji jest wyłączone.
imgw_meteo_url = "https://danepubliczne.imgw.pl/api/data/warningsmeteo"

# Ustawiane w panelu (Ustawienia → Sprzęt). Wartości tutaj są tylko startowe; panel ma pierwszeństwo.
#
# [server]
# bind = "0.0.0.0:8080"
# Panel odpowiada tylko pod literałem IP, `localhost`, nazwą hosta stacji,
# `{nazwa}.local`, `{nazwa}-{N}.local` (avahi po kolizji nazw), `{nazwa}.lan`,
# `.home`, `.home.arpa`, `.localdomain` i nazwą z `bind` (obrona przed DNS
# rebinding; inna nazwa dostaje 421). Inne nazwy, np. z lokalnego DNS, dopisz
# tutaj (tylko w pliku):
# allowed_hosts = ["stacja.dom.lan"]
#
# [audio]
# device = "default"
# sample_rate = 48000
# gain_db = -3.0
#
# [ptt]
# backend = "vox"         # gpio | serial | vox
# channel_busy = "none"
# tx_tail_ms = 250
#
# [ptt.gpio]
# chip = "/dev/gpiochip0"
# line = 17
# active_low = false
# inhibit_line = 27
#
# [ptt.serial]
# port = "/dev/ttyUSB0"
# line = "dtr"            # dtr | rts

# Pierwsze konto administratora. Tylko w pliku.
#   "console" — przy pierwszym starcie konto `admin` z hasłem wypisanym na
#               konsoli (domyślnie, instalacja „z ręki”),
#   "wizard"  — kreator http://{stacja}:8080/setup, tylko z sieci lokalnej,
#               dopóki nie ma admina (obraz Raspberry Pi). W tym trybie pusty
#               plik `aars-reset-admin` obok bazy wyłącza konta admina przy
#               starcie i otwiera kreator znowu.
#
# [setup]
# first_admin = "console"

# Aktualizacja z panelu (tylko w obrazie Raspberry Pi: systemd, Linux aarch64,
# kompilacja z kluczem wydań). Tylko w pliku: kto zmienia źródło aktualizacji,
# ten wybiera kod do uruchomienia. Wartości domyślne:
#
# [update]
# releases_url = "https://github.com/sptq/aars/releases"
# state_dir = "/var/lib/aars/update"     # katalog roboczy usługi (użytkownik aars)
# guard_dir = "/var/lib/aars-update"     # stan strażnika startu (root)
# install_root = "/opt/aars"             # releases/, current, previous
